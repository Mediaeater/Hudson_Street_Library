<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 450" fill="none">
  <!-- Clean, minimal book placeholder -->
  <rect width="300" height="450" fill="#f5f5f5"/>
  <rect x="0" y="0" width="6" height="450" fill="#d4d4d4"/>

  <!-- Optional: Simple book icon in center -->
  <g transform="translate(150, 225)" opacity="0.15">
    <rect x="-30" y="-40" width="60" height="80" rx="2" fill="#a3a3a3"/>
    <line x1="-30" y1="-40" x2="-30" y2="40" stroke="#8c8c8c" stroke-width="1"/>
  </g>
</svg>
