<style>
  :root {
    --bg: #fafaf9;
    --fg: #1a1a1a;
    --muted: #6b6b6b;
    --line: #e5e5e3;
    --accent: #1a6dc7;
    --accent-bg: #e5efff;
    --chip-bg: #f0efed;
    --chip-active: #1a1a1a;
    --chip-active-fg: #fafaf9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 'Archivo Narrow', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 16px 20px 12px;
    z-index: 10;
  }
  h1 {
    margin: 0 0 10px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  h1 .count {
    color: var(--muted);
    font-weight: 400;
  }
  #q {
    width: 100%;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    background: white;
    outline: none;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  #chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .chip {
    background: var(--chip-bg);
    color: var(--fg);
    border: 1px solid transparent;
    padding: 4px 10px;
    border-radius: 999px;
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    user-select: none;
  }
  .chip .n { color: var(--muted); margin-left: 4px; font-variant-numeric: tabular-nums; }
  .chip:hover { background: #e8e7e5; }
  .chip.active { background: var(--chip-active); color: var(--chip-active-fg); }
  .chip.active .n { color: #b8b8b8; }
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  li {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 10px;
    align-items: center;
    padding: 8px 20px;
    border-bottom: 1px solid var(--line);
  }
  li:hover { background: white; }
  li img.icon {
    width: 16px;
    height: 16px;
    border-radius: 3px;
  }
  li .no-icon {
    width: 16px;
    height: 16px;
    background: var(--chip-bg);
    border-radius: 3px;
  }
  .entry .name {
    font-weight: 500;
    color: var(--fg);
    text-decoration: none;
  }
  .entry .name:hover { color: var(--accent); text-decoration: underline; }
  .entry .url {
    display: block;
    color: var(--muted);
    font-size: 12px;
    margin-top: 1px;
    word-break: break-all;
  }
  .entry .url a { color: var(--muted); text-decoration: none; }
  .entry .url a:hover { color: var(--accent); }
  .badge {
    background: var(--chip-bg);
    color: var(--muted);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
  }
  .empty {
    padding: 40px 20px;
    color: var(--muted);
    text-align: center;
  }
  mark {
    background: #fff3a3;
    color: inherit;
    padding: 0 1px;
  }
</style>
</head>

<script>
(() => {
  const data = JSON.parse(document.getElementById('data').textContent);
  const q = document.getElementById('q');
  const list = document.getElementById('list');
  const count = document.getElementById('count');
  const chips = document.getElementById('chips');
  const active = new Set();

  // Pre-compute lowercased fields once.
  data.forEach(e => {
    e._n = (e.name || '').toLowerCase();
    e._u = (e.url || '').toLowerCase();
    e._s = (e.subfolder || '').toLowerCase();
  });

  // Section chips
  const sections = {};
  data.forEach(e => { sections[e.subfolder] = (sections[e.subfolder] || 0) + 1; });
  Object.keys(sections).sort((a,b) => a.localeCompare(b)).forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.section = s;
    b.innerHTML = `${esc(s)}<span class="n">${sections[s]}</span>`;
    b.addEventListener('click', () => {
      if (active.has(s)) { active.delete(s); b.classList.remove('active'); }
      else { active.add(s); b.classList.add('active'); }
      render();
    });
    chips.appendChild(b);
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function highlight(s, q) {
    if (!q) return esc(s);
    const lo = s.toLowerCase();
    let out = '', i = 0;
    while (i < s.length) {
      const j = lo.indexOf(q, i);
      if (j === -1) { out += esc(s.slice(i)); break; }
      out += esc(s.slice(i, j));
      out += '<mark>' + esc(s.slice(j, j + q.length)) + '</mark>';
      i = j + q.length;
    }
    return out;
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    const useSec = active.size > 0;
    const rows = [];
    for (const e of data) {
      if (useSec && !active.has(e.subfolder)) continue;
      if (term && !(e._n.includes(term) || e._u.includes(term) || e._s.includes(term))) continue;
      rows.push(e);
    }
    count.textContent = rows.length.toLocaleString();
    if (rows.length === 0) {
      list.innerHTML = '<li class="empty">No matches.</li>';
      return;
    }
    // Build via DOM string concat for speed
    const parts = new Array(rows.length);
    for (let k = 0; k < rows.length; k++) {
      const e = rows[k];
      const icon = e.icon
        ? `<img class="icon" src="${esc(e.icon)}" alt="" loading="lazy">`
        : '<span class="no-icon"></span>';
      parts[k] =
        '<li class="entry">' +
        icon +
        '<div>' +
          `<a class="name" href="${esc(e.url)}" target="_blank" rel="noopener">${highlight(e.name || '(untitled)', term)}</a>` +
          `<span class="url"><a href="${esc(e.url)}" target="_blank" rel="noopener">${highlight(e.url, term)}</a></span>` +
        '</div>' +
        `<span class="badge">${esc(e.subfolder)}</span>` +
        '</li>';
    }
    list.innerHTML = parts.join('');
  }

  q.addEventListener('input', render);
  render();
})();
</script>
