    margin-top: 10px;

  li.section {
    padding: 18px 20px 6px;

    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }
  li.section:first-child { padding-top: 8px; }
  .entry .name {
    font-weight: 500;
    color: var(--fg);
    text-decoration: none;
  }
  .entry .name:hover { color: var(--accent); text-decoration: underline; }
  .entry .url {
    display: block;
    color: var(--muted);

    margin-top: 1px;
    word-break: break-all;
  }
  .entry .url a { color: var(--muted); text-decoration: none; }
  .entry .url a:hover { color: var(--accent); }
  .empty {
    padding: 40px 20px;
    color: var(--muted);
    text-align: center;

  mark {
    background: #fff3a3;
    color: inherit;
    padding: 0 1px;

<script>

  const active = new Set();

    b.innerHTML = `${esc(s)}<span class="n">${sections[s]}</span>`;
    b.addEventListener('click', () => {
      if (active.has(s)) { active.delete(s); b.classList.remove('active'); }
      else { active.add(s); b.classList.add('active'); }
      render();
    });
    tags.appendChild(b);
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function highlight(s, q) {
    if (!q) return esc(s);
    const lo = s.toLowerCase();
    let out = '', i = 0;
    while (i < s.length) {
      const j = lo.indexOf(q, i);
      if (j === -1) { out += esc(s.slice(i)); break; }
      out += esc(s.slice(i, j));
      out += '<mark>' + esc(s.slice(j, j + q.length)) + '</mark>';
      i = j + q.length;
    }
    return out;
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    const useSec = active.size > 0;
    const rows = [];
    for (const e of data) {
      if (useSec && !active.has(e.subfolder)) continue;
      if (term && !(e._n.includes(term) || e._u.includes(term) || e._s.includes(term))) continue;
      rows.push(e);
    }
    count.textContent = rows.length.toLocaleString();
    if (rows.length === 0) {
      list.innerHTML = '<li class="empty">No matches.</li>';
      return;
    }
    // Group by section (folder), mirroring the original bookmarks folder view.
    rows.sort((a, b) =>
      (a.subfolder || '').localeCompare(b.subfolder || '') ||
      a._n.localeCompare(b._n));
    const parts = [];
    let section = null;
    for (const e of rows) {
      if (e.subfolder !== section) {
        section = e.subfolder;
        parts.push(`<li class="section">${esc(section)}</li>`);
      }
      parts.push(
        '<li class="entry">' +
          `<a class="name" href="${esc(e.url)}" target="_blank" rel="noopener">${highlight(e.name || '(untitled)', term)}</a>` +
          `<span class="url"><a href="${esc(e.url)}" target="_blank" rel="noopener">${highlight(e.url, term)}</a></span>` +
        '</li>');
    }
    list.innerHTML = parts.join('');
  }

  q.addEventListener('input', render);
  render();
})();
</script>
