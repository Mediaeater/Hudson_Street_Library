<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search & Browse · Hudson Street Library</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="stylesheet" href="/assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Crimson+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-ink: #0A0A0A;
            --color-paper: #F8F7F4;
            --color-vellum: #EEEDE8;
            --color-brown: #8B7355;
            --color-border: rgba(10, 10, 10, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--color-paper);
            color: var(--color-ink);
            font-family: 'Crimson Pro', serif;
            line-height: 1.6;
        }

        /* Page Header */
        .search-header {
            padding: 4rem 2rem 3rem;
            border-bottom: 1px solid var(--color-border);
            text-align: center;
        }

        .search-label {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-brown);
            margin-bottom: 1rem;
        }

        .search-title {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            line-height: 1;
            color: var(--color-ink);
        }

        .search-subtitle {
            margin-top: 1rem;
            font-size: 0.9375rem;
            color: var(--color-brown);
        }

        .search-subtitle a {
            color: var(--color-brown);
            text-decoration: underline;
            text-decoration-thickness: 1px;
            text-underline-offset: 2px;
            transition: opacity 0.2s ease;
        }

        .search-subtitle a:hover {
            opacity: 0.7;
        }

        /* Main Container */
        .main-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Active Filter Display */
        .active-filter {
            background: white;
            border: 2px solid var(--color-brown);
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
            display: none;
        }

        .active-filter.visible {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .filter-description {
            font-size: 1.0625rem;
            color: var(--color-ink);
        }

        .filter-description strong {
            color: var(--color-brown);
            font-weight: 600;
        }

        .clear-filter-btn {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.5rem 1rem;
            border: 1px solid var(--color-ink);
            background: transparent;
            color: var(--color-ink);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .clear-filter-btn:hover {
            background: var(--color-ink);
            color: var(--color-paper);
        }

        /* Search Controls */
        .search-controls {
            background: white;
            border: 1px solid var(--color-border);
            padding: 2rem;
            margin-bottom: 2rem;
        }

        .control-row {
            display: grid;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .control-row.primary {
            grid-template-columns: 2fr 1fr 1fr;
        }

        .control-row.filters {
            grid-template-columns: repeat(5, 1fr);
        }

        .control-label {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-brown);
            margin-bottom: 0.5rem;
            display: block;
        }

        .search-input,
        .search-select {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border);
            background: var(--color-paper);
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            color: var(--color-ink);
            transition: all 0.3s ease;
        }

        .search-input:focus,
        .search-select:focus {
            outline: none;
            border-color: var(--color-brown);
            background: white;
        }

        .control-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 1rem;
            border-top: 1px solid var(--color-border);
        }

        .visual-browse-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            font-size: 1rem;
        }

        .visual-browse-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .clear-all-btn {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--color-brown);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .clear-all-btn:hover {
            color: var(--color-ink);
        }

        /* Results Info */
        .results-info {
            margin-bottom: 2rem;
            font-size: 1rem;
            color: var(--color-ink);
        }

        .results-count {
            font-weight: 600;
            color: var(--color-brown);
        }

        /* Results Container */
        #results-container {
            margin-bottom: 3rem;
        }

        /* Book Cards (List View) */
        .book-card {
            background: white;
            border: 1px solid var(--color-border);
            padding: 2rem;
            margin-bottom: 1.5rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .book-card:hover {
            box-shadow: 0 12px 40px rgba(10, 10, 10, 0.12);
            transform: translateY(-4px);
        }

        .book-card-inner {
            display: grid;
            grid-template-columns: 150px 1fr;
            gap: 2rem;
        }

        .book-cover {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border: 1px solid var(--color-border);
            background: var(--color-vellum);
        }

        .book-details h3 {
            font-family: 'Crimson Pro', serif;
            font-size: 1.75rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.5rem;
            color: var(--color-ink);
        }

        .book-details h3 a {
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .book-details h3 a:hover {
            color: var(--color-brown);
        }

        .book-author {
            font-size: 1.0625rem;
            margin-bottom: 1rem;
            color: var(--color-ink);
        }

        .clickable-meta {
            cursor: pointer;
            transition: color 0.3s ease;
            border-bottom: 1px solid transparent;
        }

        .clickable-meta:hover {
            color: var(--color-brown);
            border-bottom-color: var(--color-brown);
        }

        .book-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            font-size: 0.9375rem;
            color: var(--color-ink);
            margin-bottom: 1rem;
        }

        .book-meta strong {
            color: var(--color-brown);
        }

        .book-description {
            font-size: 1rem;
            line-height: 1.7;
            margin-bottom: 1rem;
            color: var(--color-ink);
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .tag-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag-pill {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            padding: 0.25rem 0.75rem;
            background: var(--color-vellum);
            border: 1px solid var(--color-border);
            color: var(--color-ink);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .tag-pill:hover {
            background: var(--color-brown);
            color: var(--color-paper);
            border-color: var(--color-brown);
        }

        .collection-badge {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.25rem 0.75rem;
            background: transparent;
            border: 1px solid var(--color-brown);
            color: var(--color-brown);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .collection-badge:hover {
            background: var(--color-brown);
            color: var(--color-paper);
        }

        /* Visual Grid */
        .visual-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 2rem;
        }

        .visual-card {
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .visual-card:hover {
            transform: translateY(-4px);
        }

        .visual-card-image {
            aspect-ratio: 3/4;
            overflow: hidden;
            border: 1px solid var(--color-border);
            background: var(--color-vellum);
            margin-bottom: 0.75rem;
        }

        .visual-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .visual-card:hover .visual-card-image img {
            transform: scale(1.05);
        }

        .visual-card h4 {
            font-family: 'Crimson Pro', serif;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 0.25rem;
            color: var(--color-ink);
        }

        .visual-card p {
            font-size: 0.875rem;
            color: var(--color-brown);
        }

        .line-clamp-1, .line-clamp-2 {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-1 { -webkit-line-clamp: 1; }
        .line-clamp-2 { -webkit-line-clamp: 2; }

        /* Pagination */
        .pagination {
            display: none;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 3rem;
        }

        .pagination.visible {
            display: flex;
        }

        .pagination button {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.875rem;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border: 1px solid var(--color-border);
            background: white;
            color: var(--color-ink);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination button:hover:not(:disabled) {
            background: var(--color-brown);
            color: var(--color-paper);
            border-color: var(--color-brown);
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination button.active {
            background: var(--color-ink);
            color: var(--color-paper);
            border-color: var(--color-ink);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .control-row.primary {
                grid-template-columns: 1fr;
            }

            .control-row.filters {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 1.5rem;
            }

            .search-header {
                padding: 3rem 1.5rem 2rem;
            }

            .search-controls {
                padding: 1.5rem;
            }

            .control-row.filters {
                grid-template-columns: 1fr;
            }

            .book-card {
                padding: 1.5rem;
            }

            .book-card-inner {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }

            .book-cover {
                height: 250px;
            }

            .visual-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 1.5rem;
            }

            .active-filter.visible {
                flex-direction: column;
                gap: 1rem;
                align-items: flex-start;
            }
        }
    </style>
</head>

<script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobile-nav-menu');
    const icon = document.getElementById('mobile-menu-icon');
    const isHidden = menu.classList.contains('hidden');

    if (isHidden) {
        menu.classList.remove('hidden');
        menu.classList.add('flex', 'flex-col');
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-times');
    } else {
        menu.classList.add('hidden');
        menu.classList.remove('flex', 'flex-col');
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
    }
}
</script>

<script>
class BookSearch {
    constructor() {
        this.books = [];
        this.filteredBooks = [];
        this.searchTerm = '';
        this.filters = { publisher: '', year: '', collection: '', cover: '', tag: '' };
        this.activeFilter = null;
        this.sortBy = 'title';
        this.currentPage = 1;
        this.itemsPerPage = 24;
        this.visualBrowse = false;
        this.init();
    }

    async init() {
        try {
            const response = await fetch('/cms/data/books.csv');
            const csvText = await response.text();
            this.books = this.parseCSV(csvText);
            console.log(`Loaded ${this.books.length} books`);

            this.checkUrlParams();
            this.populateFilters();
            this.setupEventListeners();
            this.performSearch();
        } catch (error) {
            console.error('Error loading book data:', error);
            document.getElementById('results-container').innerHTML =
                '<p style="color: #8B7355; text-align: center; padding: 4rem;">Error loading book data. Please try again later.</p>';
        }
    }

    checkUrlParams() {
        const params = new URLSearchParams(window.location.search);
        const filterType = params.get('filter');
        const filterValue = params.get('value');

        if (filterType && filterValue) {
            this.activeFilter = { type: filterType, value: decodeURIComponent(filterValue) };

            if (filterType === 'publisher') this.filters.publisher = filterValue;
            else if (filterType === 'year') this.filters.year = filterValue;
            else if (filterType === 'tag') this.filters.tag = filterValue;
            else if (filterType === 'collection') this.filters.collection = filterValue;

            this.showActiveFilter();
        }
    }

    showActiveFilter() {
        if (!this.activeFilter) return;

        const filterDiv = document.getElementById('active-filter');
        const filterDesc = document.getElementById('filter-description');

        filterDiv.classList.add('visible');

        let description = '';
        if (this.activeFilter.type === 'publisher') {
            description = `Viewing all books by <strong>${this.activeFilter.value}</strong>`;
        } else if (this.activeFilter.type === 'year') {
            description = `Viewing all books from <strong>${this.activeFilter.value}</strong>`;
        } else if (this.activeFilter.type === 'tag') {
            description = `Viewing all books tagged <strong>"${this.activeFilter.value}"</strong>`;
        } else if (this.activeFilter.type === 'collection') {
            description = `Viewing <strong>${this.activeFilter.value}</strong> collection`;
        }

        filterDesc.innerHTML = description;
    }

    clearActiveFilter() {
        this.activeFilter = null;
        window.history.pushState({}, '', window.location.pathname);
        document.getElementById('active-filter').classList.remove('visible');
        this.clearAllFilters();
    }

    navigateToAggregate(filterType, filterValue) {
        const url = `${window.location.pathname}?filter=${filterType}&value=${encodeURIComponent(filterValue)}`;
        window.location.href = url;
    }

    parseCSV(csvText) {
        const lines = csvText.split('\n').filter(line => line.trim());
        if (lines.length === 0) return [];

        const headers = this.parseCSVLine(lines[0]);
        const books = [];

        for (let i = 1; i < lines.length; i++) {
            const values = this.parseCSVLine(lines[i]);
            if (values.length === headers.length) {
                const book = {};
                headers.forEach((header, index) => {
                    book[header] = values[index] || '';
                });
                books.push(book);
            }
        }

        return books;
    }

    parseCSVLine(line) {
        const values = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            const nextChar = line[i + 1];

            if (char === '"' && inQuotes && nextChar === '"') {
                current += '"';
                i++;
            } else if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                values.push(current.trim());
                current = '';
            } else {
                current += char;
            }
        }

        values.push(current.trim());
        return values;
    }

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    setupEventListeners() {
        document.getElementById('search-input').addEventListener('input', (e) => {
            this.searchTerm = e.target.value.toLowerCase();
            this.currentPage = 1;
            this.performSearch();
        });

        document.getElementById('sort-select').addEventListener('change', (e) => {
            this.sortBy = e.target.value;
            this.currentPage = 1;
            this.performSearch();
        });

        ['publisher-filter', 'year-filter', 'collection-filter', 'cover-filter', 'tag-filter'].forEach(id => {
            document.getElementById(id).addEventListener('change', (e) => {
                const filterType = id.replace('-filter', '');
                this.filters[filterType] = e.target.value;
                this.currentPage = 1;
                this.performSearch();
            });
        });

        document.getElementById('visual-browse').addEventListener('change', (e) => {
            this.visualBrowse = e.target.checked;
            this.performSearch();
        });

        document.getElementById('items-per-page').addEventListener('change', (e) => {
            this.itemsPerPage = parseInt(e.target.value);
            this.currentPage = 1;
            this.performSearch();
        });

        document.getElementById('prev-page').addEventListener('click', () => {
            if (this.currentPage > 1) {
                this.currentPage--;
                this.performSearch();
            }
        });

        document.getElementById('next-page').addEventListener('click', () => {
            const totalPages = Math.ceil(this.filteredBooks.length / this.itemsPerPage);
            if (this.currentPage < totalPages) {
                this.currentPage++;
                this.performSearch();
            }
        });
    }

    populateFilters() {
        const publishers = [...new Set(this.books.map(book => book.publisher).filter(p => p && p !== 'NULL'))].sort();
        const years = [...new Set(this.books.map(book => book.publication_year).filter(y => y && y !== 'NULL'))].sort((a, b) => b - a);
        const collections = [...new Set(this.books.map(book => book.collection_grouping).filter(c => c && c !== 'NULL'))].sort();

        const allTags = new Set();
        this.books.forEach(book => {
            if (book.tags && book.tags !== 'NULL') {
                book.tags.split(',').map(t => t.trim()).filter(t => t).forEach(tag => allTags.add(tag));
            }
        });
        const tags = [...allTags].sort();

        this.populateSelect('publisher-filter', publishers);
        this.populateSelect('year-filter', years);
        this.populateSelect('collection-filter', collections);
        this.populateSelect('tag-filter', tags);
    }

    populateSelect(selectId, options) {
        const select = document.getElementById(selectId);
        const currentValue = select.value;

        while (select.children.length > 1) {
            select.removeChild(select.lastChild);
        }

        options.forEach(option => {
            const optionElement = document.createElement('option');
            optionElement.value = option;
            optionElement.textContent = option;
            select.appendChild(optionElement);
        });

        select.value = currentValue;
    }

    clearAllFilters() {
        document.getElementById('search-input').value = '';
        document.getElementById('sort-select').value = 'title';
        document.getElementById('publisher-filter').value = '';
        document.getElementById('year-filter').value = '';
        document.getElementById('collection-filter').value = '';
        document.getElementById('cover-filter').value = '';
        document.getElementById('tag-filter').value = '';
        document.getElementById('visual-browse').checked = false;

        this.searchTerm = '';
        this.filters = { publisher: '', year: '', collection: '', cover: '', tag: '' };
        this.visualBrowse = false;
        this.sortBy = 'title';
        this.currentPage = 1;
        this.performSearch();
    }

    performSearch() {
        this.filteredBooks = this.books.filter(book => {
            if (this.searchTerm) {
                const searchableText = [
                    book.title,
                    book.author_full_name,
                    book.publisher,
                    book.description,
                    book.tags
                ].join(' ').toLowerCase();

                if (!searchableText.includes(this.searchTerm)) return false;
            }

            if (this.filters.publisher && book.publisher !== this.filters.publisher) return false;
            if (this.filters.year && book.publication_year !== this.filters.year) return false;
            if (this.filters.collection && book.collection_grouping !== this.filters.collection) return false;

            if (this.filters.tag) {
                if (!book.tags || book.tags === 'NULL') return false;
                const bookTags = book.tags.split(',').map(t => t.trim());
                if (!bookTags.includes(this.filters.tag)) return false;
            }

            if (this.filters.cover) {
                const hasCover = this.generateCoverImagePath(book) !== '/assets/images/placeholder-book.svg';
                if (this.filters.cover === 'with-covers' && !hasCover) return false;
                if (this.filters.cover === 'without-covers' && hasCover) return false;
            }

            return true;
        });

        this.sortResults();
        this.displayResults();
    }

    sortResults() {
        this.filteredBooks.sort((a, b) => {
            let aVal, bVal;

            switch (this.sortBy) {
                case 'title':
                    aVal = a.title || '';
                    bVal = b.title || '';
                    break;
                case 'author':
                    aVal = a.author_full_name || '';
                    bVal = b.author_full_name || '';
                    break;
                case 'year':
                    aVal = parseInt(a.publication_year) || 0;
                    bVal = parseInt(b.publication_year) || 0;
                    return bVal - aVal;
                case 'publisher':
                    aVal = a.publisher || '';
                    bVal = b.publisher || '';
                    break;
                default:
                    return 0;
            }

            return aVal < bVal ? -1 : aVal > bVal ? 1 : 0;
        });
    }

    displayResults() {
        const resultsContainer = document.getElementById('results-container');
        const resultsCount = document.getElementById('results-count');

        resultsCount.textContent = this.filteredBooks.length;

        if (this.filteredBooks.length === 0) {
            resultsContainer.innerHTML = '<p style="color: #8B7355; text-align: center; padding: 4rem;">No books found matching your criteria.</p>';
            this.updatePagination();
            return;
        }

        const startIndex = (this.currentPage - 1) * this.itemsPerPage;
        const endIndex = startIndex + this.itemsPerPage;
        const pageBooks = this.filteredBooks.slice(startIndex, endIndex);

        if (this.visualBrowse) {
            resultsContainer.innerHTML = `<div class="visual-grid">${pageBooks.map(book => this.renderVisualCard(book)).join('')}</div>`;
        } else {
            resultsContainer.innerHTML = pageBooks.map(book => this.renderBookCard(book)).join('');
        }

        this.updatePagination();
    }

    renderVisualCard(book) {
        const imageUrl = this.generateCoverImagePath(book);
        const author = (book.author_full_name && book.author_full_name !== 'NULL') ? book.author_full_name : 'Unknown Author';
        const year = (book.publication_year && book.publication_year !== 'NULL') ? book.publication_year : '';

        return `
            <div class="visual-card">
                <div class="visual-card-image">
                    <img src="${imageUrl}"
                         alt="${this.escapeHtml(book.title)}"
                         onerror="this.src='/assets/images/placeholder-book.svg'"
                         loading="lazy">
                </div>
                <h4 class="line-clamp-2">${this.escapeHtml(book.title)}</h4>
                <p class="line-clamp-1 clickable-meta"
                   onclick="bookSearch.navigateToAggregate('publisher', '${this.escapeHtml(author).replace(/'/g, "\\'")}')">${this.escapeHtml(author)}</p>
                ${year ? `<p class="clickable-meta"
                          onclick="bookSearch.navigateToAggregate('year', '${year}')">${year}</p>` : ''}
            </div>
        `;
    }

    renderBookCard(book) {
        const imageUrl = this.generateCoverImagePath(book);
        const year = (book.publication_year && book.publication_year !== 'NULL') ? book.publication_year : '';
        const pages = (book.page_count && book.page_count !== 'NULL') ? `${book.page_count} pages` : '';
        const binding = (book.binding && book.binding !== 'NULL') ? book.binding : '';
        const publisher = (book.publisher && book.publisher !== 'NULL') ? book.publisher : '';
        const author = (book.author_full_name && book.author_full_name !== 'NULL') ? book.author_full_name : 'Unknown Author';

        const tags = [];
        if (book.tags && book.tags !== 'NULL') {
            book.tags.split(',').forEach(tag => {
                const trimmedTag = tag.trim();
                if (trimmedTag) tags.push(trimmedTag);
            });
        }

        return `
            <div class="book-card">
                <div class="book-card-inner">
                    <div>
                        <img src="${imageUrl}"
                             alt="${this.escapeHtml(book.title)}"
                             class="book-cover"
                             onerror="this.src='/assets/images/placeholder-book.svg'"
                             loading="lazy">
                    </div>
                    <div class="book-details">
                        <h3>
                            <a href="${this.generateBookPageUrl(book)}">${this.escapeHtml(book.title)}</a>
                        </h3>
                        <p class="book-author">
                            by <span class="clickable-meta" onclick="bookSearch.navigateToAggregate('publisher', '${this.escapeHtml(author).replace(/'/g, "\\'")}')">${this.escapeHtml(author)}</span>
                        </p>
                        <div class="book-meta">
                            ${publisher ? `<span><strong>Publisher:</strong> <span class="clickable-meta" onclick="bookSearch.navigateToAggregate('publisher', '${this.escapeHtml(publisher).replace(/'/g, "\\'")}')">${this.escapeHtml(publisher)}</span></span>` : ''}
                            ${year ? `<span><strong>Year:</strong> <span class="clickable-meta" onclick="bookSearch.navigateToAggregate('year', '${year}')">${year}</span></span>` : ''}
                            ${binding ? `<span><strong>Format:</strong> ${this.escapeHtml(binding)}</span>` : ''}
                            ${pages ? `<span><strong>Pages:</strong> ${pages}</span>` : ''}
                        </div>
                        ${book.description && book.description !== 'NULL' ? `
                            <p class="book-description line-clamp-3">
                                ${this.escapeHtml(book.description.substring(0, 200))}${book.description.length > 200 ? '...' : ''}
                            </p>
                        ` : ''}

                        ${tags.length > 0 ? `
                            <div class="tag-pills">
                                ${tags.map(tag => `
                                    <span class="tag-pill"
                                          onclick="bookSearch.navigateToAggregate('tag', '${this.escapeHtml(tag).replace(/'/g, "\\'")}')">
                                        ${this.escapeHtml(tag)}
                                    </span>
                                `).join('')}
                            </div>
                        ` : ''}

                        ${book.collection_grouping && book.collection_grouping !== 'NULL' ? `
                            <span class="collection-badge"
                                  onclick="bookSearch.navigateToAggregate('collection', '${this.escapeHtml(book.collection_grouping).replace(/'/g, "\\'")}')">
                                ${this.escapeHtml(book.collection_grouping)}
                            </span>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
    }

    generateCoverImagePath(book) {
        if (book.image_url && book.image_url !== 'NULL' && book.image_url !== '' && book.image_url !== null && book.image_url !== 'null') {
            return book.image_url;
        }

        const author = (book.author_last || 'Unknown').replace(/[^a-zA-Z0-9.-]/g, '_');
        const title = (book.title || 'Untitled').replace(/[^a-zA-Z0-9.-]/g, '_');
        const isbn = (book.isbn_asin || '').replace(/[^a-zA-Z0-9.-]/g, '_');

        if (isbn && isbn !== 'NULL' && isbn !== '') {
            const coverFileName = `${author}_${title}_${isbn}`.replace(/_+/g, '_').replace(/^_|_$/g, '').substring(0, 150) + '.jpg';
            return `/assets/images/books/${coverFileName}`;
        } else {
            const coverFileName = `${author}_${title}_NULL`.replace(/_+/g, '_').replace(/^_|_$/g, '').substring(0, 150) + '.jpg';
            return `/assets/images/books/${coverFileName}`;
        }
    }

    generateBookPageUrl(book) {
        const author = (book.author_last || 'unknown')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');

        const title = (book.title || 'untitled')
            .toLowerCase()
            .replace(/[^a-z0-9]+/g, '-')
            .replace(/^-+|-+$/g, '');

        const id = book.id || '';

        return `/books/${author}_${title}_${id}/`;
    }

    updatePagination() {
        const totalPages = Math.ceil(this.filteredBooks.length / this.itemsPerPage);
        const paginationContainer = document.getElementById('pagination');
        const prevButton = document.getElementById('prev-page');
        const nextButton = document.getElementById('next-page');
        const pageNumbers = document.getElementById('page-numbers');

        if (totalPages <= 1) {
            paginationContainer.classList.remove('visible');
            return;
        }

        paginationContainer.classList.add('visible');

        prevButton.disabled = this.currentPage <= 1;
        nextButton.disabled = this.currentPage >= totalPages;

        pageNumbers.innerHTML = '';
        const maxVisiblePages = 5;
        let startPage = Math.max(1, this.currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            const pageButton = document.createElement('button');
            pageButton.textContent = i;
            pageButton.className = i === this.currentPage ? 'active' : '';
            pageButton.addEventListener('click', () => {
                this.currentPage = i;
                this.performSearch();
            });
            pageNumbers.appendChild(pageButton);
        }
    }
}

let bookSearch;
document.addEventListener('DOMContentLoaded', () => {
    bookSearch = new BookSearch();
});
</script>
