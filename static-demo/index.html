<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search the Collection · Hudson Street Library</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="stylesheet" href="/assets/css/design-system.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Crimson+Pro:wght@300;400;600&family=Archivo+Narrow:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-ink: #0A0A0A;
            --color-paper: #F8F7F4;
            --color-vellum: #EEEDE8;
            --color-brown: #8B7355;
            --color-border: rgba(10, 10, 10, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--color-paper);
            color: var(--color-ink);
            font-family: 'Crimson Pro', serif;
            line-height: 1.6;
        }

        /* Page Header */
        .search-header {
            padding: 4rem 2rem 3rem;
            border-bottom: 1px solid var(--color-border);
            text-align: center;
        }

        .search-label {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-brown);
            margin-bottom: 1rem;
        }

        .search-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 700;
            line-height: 1;
            color: var(--color-ink);
        }

        /* Search Controls — editorial finding-aid */
        .search-controls {
            background: white;
            border-top: 1px solid var(--color-ink);
            border-bottom: 1px solid var(--color-border);
            padding: 2.5rem 2.25rem 1.75rem;
            margin: 2rem 0 2.5rem;
        }

        .search-row {
            display: grid;
            grid-template-columns: 1fr 280px;
            gap: 1.75rem;
            align-items: end;
            padding-bottom: 1.75rem;
            border-bottom: 1px solid var(--color-border);
        }

        .control-label {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--color-brown);
            margin-bottom: 0.55rem;
            display: block;
        }

        .search-input {
            width: 100%;
            padding: 0.35rem 2.25rem 0.75rem 0;
            border: none;
            border-bottom: 1px solid var(--color-ink);
            background: transparent;
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.625rem;
            font-weight: 400;
            color: var(--color-ink);
            transition: border-color 0.3s ease;
        }

        .search-input-wrap {
            position: relative;
        }

        .search-input-wrap::after {
            content: '';
            position: absolute;
            right: 0.25rem;
            bottom: 0.85rem;
            width: 14px;
            height: 14px;
            border: 1.5px solid var(--color-ink);
            border-radius: 50%;
            pointer-events: none;
        }

        .search-input-wrap::before {
            content: '';
            position: absolute;
            right: 0;
            bottom: 0.7rem;
            width: 6px;
            height: 1.5px;
            background: var(--color-ink);
            transform: rotate(45deg);
            transform-origin: right center;
            pointer-events: none;
        }

        .search-input:focus {
            outline: none;
            border-bottom-color: var(--color-brown);
        }

        .search-input::placeholder {
            color: rgba(10, 10, 10, 0.35);
            font-style: italic;
        }

        .search-select {
            width: 100%;
            padding: 0.55rem 2rem 0.55rem 0.9rem;
            border: 1px solid var(--color-border);
            background: var(--color-paper);
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' fill='none' stroke='%230A0A0A' stroke-width='1.2' stroke-linecap='square'/></svg>");
            background-repeat: no-repeat;
            background-position: right 0.85rem center;
            font-family: 'Crimson Pro', serif;
            font-size: 0.9375rem;
            color: var(--color-ink);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: border-color 0.3s ease, background-color 0.3s ease;
        }

        .search-select:hover {
            border-color: var(--color-ink);
        }

        .search-select:focus {
            outline: none;
            border-color: var(--color-brown);
            background-color: white;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1.25rem;
            padding-top: 1.5rem;
        }

        @media (max-width: 720px) {
            .search-row { grid-template-columns: 1fr; }
            .filter-row { grid-template-columns: 1fr; }
        }

        .controls-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1.5rem;
            padding-top: 1.5rem;
            margin-top: 1.5rem;
            border-top: 1px solid var(--color-border);
        }

        .toggle-switch {
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            cursor: pointer;
            user-select: none;
        }

        .toggle-switch input[type="checkbox"] {
            position: absolute;
            opacity: 0;
            pointer-events: none;
        }

        .toggle-track {
            position: relative;
            width: 34px;
            height: 18px;
            border: 1px solid var(--color-ink);
            background: var(--color-paper);
            transition: background-color 0.25s ease;
        }

        .toggle-track::after {
            content: '';
            position: absolute;
            top: 2px;
            left: 2px;
            width: 12px;
            height: 12px;
            background: var(--color-ink);
            transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.25s;
        }

        .toggle-switch input:checked ~ .toggle-track {
            background: var(--color-ink);
        }

        .toggle-switch input:checked ~ .toggle-track::after {
            transform: translateX(16px);
            background: var(--color-paper);
        }

        .toggle-label {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--color-ink);
        }

        .clear-filters-btn {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.6875rem;
            font-weight: 700;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--color-brown);
            background: none;
            border: none;
            padding: 0;
            cursor: pointer;
            border-bottom: 1px solid transparent;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        .clear-filters-btn:hover {
            color: var(--color-ink);
            border-bottom-color: var(--color-ink);
        }

        .results-count {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.6875rem;
            font-weight: 600;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--color-brown);
            font-variant-numeric: tabular-nums;
        }

        /* Results Grid and Cards */
        .results-container {
            margin: 2rem 0;
        }

        .book-card {
            background: white;
            border: 1px solid var(--color-border);
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .book-card:hover {
            box-shadow: 0 12px 40px rgba(10, 10, 10, 0.12);
            transform: translateY(-4px);
        }

        .book-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 0.5rem;
        }

        .book-title a {
            color: var(--color-ink);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .book-title a:hover {
            color: var(--color-brown);
        }

        .book-author {
            font-size: 1.0625rem;
            color: var(--color-brown);
            margin-bottom: 1rem;
        }

        .book-meta {
            font-size: 0.875rem;
            color: rgba(10, 10, 10, 0.7);
            margin-bottom: 1rem;
        }

        .book-meta strong {
            color: var(--color-ink);
        }

        .book-description {
            font-size: 0.9375rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .book-tags {
            font-size: 0.8125rem;
            color: var(--color-brown);
        }

        /* Visual Grid */
        .visual-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
        }

        .visual-card {
            cursor: pointer;
        }

        .visual-cover {
            aspect-ratio: 3/4;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--color-border);
            margin-bottom: 0.75rem;
        }

        .visual-cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .visual-card:hover .visual-cover img {
            transform: scale(1.05);
        }

        .visual-title {
            font-family: 'Crimson Pro', serif;
            font-size: 0.875rem;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 0.25rem;
            text-align: center;
        }

        .visual-author {
            font-size: 0.75rem;
            color: var(--color-brown);
            text-align: center;
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin: 3rem 0;
        }

        .pagination-btn {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.75rem 1.5rem;
            border: 1px solid var(--color-border);
            background: white;
            color: var(--color-ink);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .pagination-btn:hover:not(:disabled) {
            background: var(--color-ink);
            color: var(--color-paper);
            border-color: var(--color-ink);
        }

        .pagination-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .pagination-btn.active {
            background: var(--color-brown);
            color: white;
            border-color: var(--color-brown);
        }

        /* Loading and Empty States */
        .loading-state,
        .empty-state,
        .error-state {
            text-align: center;
            padding: 4rem 2rem;
        }

        .loading-state i {
            font-size: 2rem;
            color: var(--color-brown);
            margin-bottom: 1rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: rgba(10, 10, 10, 0.2);
            margin-bottom: 1rem;
        }

        .state-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .state-text {
            color: rgba(10, 10, 10, 0.6);
        }

        /* Line Clamp Utilities */
        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .search-header {
                padding: 3rem 1.5rem 2rem;
            }

            .search-controls {
                padding: 1.5rem;
            }

            .visual-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 1rem;
            }
        }
    </style>
</head>

<script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobile-nav-menu');
    const icon = document.getElementById('mobile-menu-icon');
    const isHidden = menu.classList.contains('hidden');

    if (isHidden) {
        menu.classList.remove('hidden');
        menu.classList.add('flex', 'flex-col');
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-times');
    } else {
        menu.classList.add('hidden');
        menu.classList.remove('flex', 'flex-col');
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
    }
}
</script>

<script>
class BookSearch {
    constructor() {
        this.books = [];
        this.filteredBooks = [];
        this.currentPage = 1;
        this.itemsPerPage = 20;
        this.searchTerm = '';
        this.filters = {
            publisher: '',
            year: '',
            collection: '',
            cover: ''
        };
        this.visualBrowse = false;
        this.sortBy = 'date';

        this.init();
    }

    async init() {
        await this.loadBooks();
        this.setupEventListeners();
        this.populateFilters();
        this.performSearch();
    }

    async loadBooks() {
        console.log('Starting to load books...');
        return await this.loadBooksFromCSV();
    }

    async loadBooksFromCSV() {
        try {
            console.log('Fetching CSV from /cms/data/books.csv...');
            const response = await fetch('/cms/data/books.csv');
            console.log('CSV response status:', response.status);

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const csvText = await response.text();
            console.log('CSV text length:', csvText.length);
            console.log('First 200 chars:', csvText.substring(0, 200));

            this.books = this.parseCSV(csvText);
            console.log('Final books array length:', this.books.length);

        } catch (error) {
            console.error('Failed to load books data:', error);
            this.displayError('Failed to load book collection. Please try again later.');
        }
    }

    parseCSV(csvText) {
        try {
            const rows = this.parseCSVStream(csvText);
            if (rows.length < 2) {
                console.error('CSV has insufficient data');
                return [];
            }

            const headers = rows[0];
            const books = [];

            for (let i = 1; i < rows.length; i++) {
                const values = rows[i];
                if (values.length < 5) continue;

                const book = {};
                headers.forEach((header, index) => {
                    book[header] = values[index] !== undefined ? values[index] : '';
                });

                if (book.title && book.title !== 'NULL') {
                    books.push(book);
                }
            }

            console.log(`Parsed ${books.length} books from CSV`);
            return books;

        } catch (error) {
            console.error('CSV parsing error:', error);
            return [];
        }
    }

    // Single-pass CSV parser that respects quoted fields containing newlines.
    parseCSVStream(csvText) {
        const rows = [];
        let row = [];
        let current = '';
        let inQuotes = false;

        for (let i = 0; i < csvText.length; i++) {
            const char = csvText[i];
            const nextChar = csvText[i + 1];

            if (char === '"') {
                if (inQuotes && nextChar === '"') {
                    current += '"';
                    i++;
                } else {
                    inQuotes = !inQuotes;
                }
            } else if (char === ',' && !inQuotes) {
                row.push(current);
                current = '';
            } else if ((char === '\n' || char === '\r') && !inQuotes) {
                if (char === '\r' && nextChar === '\n') i++;
                row.push(current);
                current = '';
                if (row.length > 1 || row[0] !== '') rows.push(row);
                row = [];
            } else {
                current += char;
            }
        }

        if (current !== '' || row.length > 0) {
            row.push(current);
            if (row.length > 1 || row[0] !== '') rows.push(row);
        }

        return rows;
    }

    setupEventListeners() {
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');
        const publisherFilter = document.getElementById('publisher-filter');
        const yearFilter = document.getElementById('year-filter');
        const collectionFilter = document.getElementById('collection-filter');
        const visualBrowseCheckbox = document.getElementById('visual-browse');
        const clearFilters = document.getElementById('clear-filters');
        const prevPage = document.getElementById('prev-page');
        const nextPage = document.getElementById('next-page');

        searchInput.addEventListener('input', (e) => {
            this.searchTerm = e.target.value.toLowerCase();
            this.currentPage = 1;
            this.performSearch();
        });

        sortSelect.addEventListener('change', (e) => {
            this.sortBy = e.target.value;
            this.performSearch();
        });

        publisherFilter.addEventListener('change', (e) => {
            this.filters.publisher = e.target.value;
            this.currentPage = 1;
            this.performSearch();
        });

        yearFilter.addEventListener('change', (e) => {
            this.filters.year = e.target.value;
            this.currentPage = 1;
            this.performSearch();
        });

        collectionFilter.addEventListener('change', (e) => {
            this.filters.collection = e.target.value;
            this.currentPage = 1;
            this.performSearch();
        });

        visualBrowseCheckbox.addEventListener('change', (e) => {
            this.visualBrowse = e.target.checked;
            this.performSearch();
        });

        clearFilters.addEventListener('click', () => {
            this.clearAllFilters();
        });

        prevPage.addEventListener('click', () => {
            if (this.currentPage > 1) {
                this.currentPage--;
                this.performSearch();
            }
        });

        nextPage.addEventListener('click', () => {
            const totalPages = Math.ceil(this.filteredBooks.length / this.itemsPerPage);
            if (this.currentPage < totalPages) {
                this.currentPage++;
                this.performSearch();
            }
        });
    }

    populateFilters() {
        const publishers = [...new Set(this.books.map(book => book.publisher).filter(p => p))].sort();
        const years = [...new Set(this.books.map(book => book.publication_year).filter(y => y))].sort((a, b) => b - a);
        const collections = [...new Set(this.books.map(book => book.collection_grouping).filter(c => c))].sort();

        this.populateSelect('publisher-filter', publishers);
        this.populateSelect('year-filter', years);
        this.populateSelect('collection-filter', collections);
    }

    populateSelect(selectId, options) {
        const select = document.getElementById(selectId);
        const currentValue = select.value;

        while (select.children.length > 1) {
            select.removeChild(select.lastChild);
        }

        options.forEach(option => {
            const optionElement = document.createElement('option');
            optionElement.value = option;
            optionElement.textContent = option;
            select.appendChild(optionElement);
        });

        select.value = currentValue;
    }

    clearAllFilters() {
        document.getElementById('search-input').value = '';
        document.getElementById('sort-select').value = 'date';
        document.getElementById('publisher-filter').value = '';
        document.getElementById('year-filter').value = '';
        document.getElementById('collection-filter').value = '';
        document.getElementById('visual-browse').checked = false;

        this.searchTerm = '';
        this.filters = { publisher: '', year: '', collection: '' };
        this.visualBrowse = false;
        this.sortBy = 'date';
        this.currentPage = 1;
        this.performSearch();
    }

    performSearch() {
        this.filteredBooks = this.books.filter(book => {
            if (this.searchTerm) {
                const searchableText = [
                    book.title,
                    book.author_full_name,
                    book.tags
                ].join(' ').toLowerCase();

                if (!searchableText.includes(this.searchTerm)) {
                    return false;
                }
            }

            if (this.filters.publisher && book.publisher !== this.filters.publisher) {
                return false;
            }

            if (this.filters.year && book.publication_year !== this.filters.year) {
                return false;
            }

            if (this.filters.collection && book.collection_grouping !== this.filters.collection) {
                return false;
            }

            return true;
        });

        this.sortResults();
        this.displayResults();
        this.updatePagination();
        this.updateResultsCount();
    }

    sortResults() {
        this.filteredBooks.sort((a, b) => {
            let aValue, bValue;

            switch (this.sortBy) {
                case 'date':
                    // Newest accession first. accession_no is free-form text
                    // ("2026-04-19", "Summer 2023", "October 2024"), so
                    // normalize to YYYY-MM-DD before comparing. Tie-break by id.
                    aValue = this.normalizeAccessionDate(a.accession_no) || '0000-00-00';
                    bValue = this.normalizeAccessionDate(b.accession_no) || '0000-00-00';
                    if (aValue !== bValue) return bValue.localeCompare(aValue);
                    return (parseInt(b.id) || 0) - (parseInt(a.id) || 0);
                case 'author':
                    aValue = a.author_full_name || '';
                    bValue = b.author_full_name || '';
                    break;
                case 'year':
                    aValue = parseInt(a.publication_year) || 0;
                    bValue = parseInt(b.publication_year) || 0;
                    return bValue - aValue;
                case 'publisher':
                    aValue = a.publisher || '';
                    bValue = b.publisher || '';
                    break;
                default:
                    aValue = a.title || '';
                    bValue = b.title || '';
            }

            return aValue.toString().localeCompare(bValue.toString());
        });
    }

    displayResults() {
        const resultsContainer = document.getElementById('search-results');
        const startIndex = (this.currentPage - 1) * this.itemsPerPage;
        const endIndex = startIndex + this.itemsPerPage;
        const pageBooks = this.filteredBooks.slice(startIndex, endIndex);

        if (pageBooks.length === 0) {
            resultsContainer.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-search"></i>
                    <h3 class="state-title">No books found</h3>
                    <p class="state-text">Try adjusting your search terms or filters.</p>
                </div>
            `;
            return;
        }

        if (this.visualBrowse) {
            resultsContainer.innerHTML = this.renderVisualGrid(pageBooks);
        } else {
            resultsContainer.innerHTML = pageBooks.map(book => this.renderBookCard(book)).join('');
        }
    }

    renderVisualGrid(books) {
        return `
            <div class="visual-grid">
                ${books.map(book => this.renderVisualCard(book)).join('')}
            </div>
        `;
    }

    renderVisualCard(book) {
        const imageUrl = this.generateCoverImagePath(book);
        const hasRealCover = imageUrl !== '/assets/images/placeholder-book.svg';
        const author = (book.author_full_name && book.author_full_name !== 'NULL') ? book.author_full_name : 'Unknown Author';

        return `
            <div class="visual-card">
                <div class="visual-cover">
                    <img src="${imageUrl}"
                         alt="${this.escapeHtml(book.title)}"
                         style="${hasRealCover ? '' : 'opacity: 0.3;'}"
                         onerror="this.src='/assets/images/placeholder-book.svg'"
                         loading="lazy">
                </div>
                <div class="visual-title line-clamp-2">
                    ${this.escapeHtml(book.title.length > 50 ? book.title.substring(0, 50) + '...' : book.title)}
                </div>
                <div class="visual-author line-clamp-1">
                    ${this.escapeHtml(author.length > 30 ? author.substring(0, 30) + '...' : author)}
                </div>
            </div>
        `;
    }

    generateCoverImagePath(book) {
        if (book.image_url &&
            book.image_url !== 'NULL' &&
            book.image_url !== '' &&
            book.image_url !== null &&
            book.image_url !== 'null') {
            return book.image_url;
        }

        const authorLast = (book.author_last || 'Unknown').replace(/[^a-zA-Z0-9.-]/g, '_');
        const title = (book.title || 'Untitled').replace(/[^a-zA-Z0-9.-]/g, '_');
        const isbn = (book.isbn_asin || '').replace(/[^a-zA-Z0-9.-]/g, '_').replace(/[-\s]/g, '');

        let filename;
        if (isbn && isbn !== 'NULL' && isbn !== '' && isbn !== 'null') {
            filename = `${authorLast}_${title}_${isbn}`;
        } else {
            filename = `${authorLast}_${title}_NULL`;
        }

        const sanitized = filename
            .replace(/[^a-zA-Z0-9.-]/g, '_')
            .replace(/_+/g, '_')
            .replace(/^_|_$/g, '')
            .substring(0, 100);

        return `/assets/images/books/${sanitized}.jpg`;
    }

    generateBookPageUrl(book) {
        // Match Eleventy's slugify behavior (slugify npm package with strict: true)
        const slugifyText = (text) => {
            return (text || '')
                .toLowerCase()
                .replace(/&/g, 'and')                    // & → and
                .replace(/[^\w\s-]/g, '')                // Remove special chars (keep word chars, spaces, hyphens)
                .replace(/\s+/g, '-')                    // Spaces → hyphens
                .replace(/-+/g, '-')                     // Multiple hyphens → single hyphen
                .replace(/^-+|-+$/g, '');                // Trim leading/trailing hyphens
        };

        const author = slugifyText(book.author_last || 'unknown');
        const title = slugifyText(book.title || 'untitled');
        const id = book.id || '';

        return `/books/${author}_${title}_${id}/`;
    }

    renderBookCard(book) {
        const imageUrl = this.generateCoverImagePath(book);
        const hasRealCover = imageUrl !== '/assets/images/placeholder-book.svg';

        const year = (book.publication_year && book.publication_year !== 'NULL') ? book.publication_year : '';
        const pages = (book.page_count && book.page_count !== 'NULL') ? `${book.page_count} pages` : '';
        const binding = (book.binding && book.binding !== 'NULL') ? book.binding : '';
        const publisher = (book.publisher && book.publisher !== 'NULL') ? book.publisher : '';
        const author = (book.author_full_name && book.author_full_name !== 'NULL') ? book.author_full_name : 'Unknown Author';

        return `
            <div class="book-card">
                <div style="display: grid; grid-template-columns: 120px 1fr; gap: 1.5rem;">
                    <div>
                        <img src="${imageUrl}"
                             alt="${this.escapeHtml(book.title)}"
                             style="width: 100%; height: 160px; object-fit: cover; border: 1px solid var(--color-border); ${hasRealCover ? '' : 'opacity: 0.3;'}"
                             onerror="this.src='/assets/images/placeholder-book.svg'"
                             loading="lazy">
                    </div>
                    <div>
                        <h3 class="book-title">
                            <a href="${this.generateBookPageUrl(book)}">
                                ${this.escapeHtml(book.title)}
                            </a>
                        </h3>
                        <p class="book-author">
                            ${this.escapeHtml(author)}
                        </p>
                        <div class="book-meta">
                            ${publisher ? `<span><strong>Publisher:</strong> ${this.escapeHtml(publisher)}</span> · ` : ''}
                            ${year ? `<span><strong>Year:</strong> ${year}</span> · ` : ''}
                            ${binding ? `<span><strong>Format:</strong> ${this.escapeHtml(binding)}</span> · ` : ''}
                            ${pages ? `<span><strong>Pages:</strong> ${pages}</span>` : ''}
                        </div>
                        ${(() => {
                            const plain = this.stripHtml(book.description);
                            if (!plain || plain === 'NULL') return '';
                            const snippet = plain.length > 240 ? this.escapeHtml(plain.substring(0, 240)) + '…' : this.escapeHtml(plain);
                            return `<p class="book-description line-clamp-3">${snippet}</p>`;
                        })()}
                        ${book.tags && book.tags !== 'NULL' ? `
                            <p class="book-tags">
                                ${this.escapeHtml(book.tags)}
                            </p>
                        ` : ''}
                    </div>
                </div>
            </div>
        `;
    }

    updatePagination() {
        const totalPages = Math.ceil(this.filteredBooks.length / this.itemsPerPage);
        const paginationContainer = document.getElementById('pagination');
        const prevButton = document.getElementById('prev-page');
        const nextButton = document.getElementById('next-page');
        const pageNumbers = document.getElementById('page-numbers');

        if (totalPages <= 1) {
            paginationContainer.style.display = 'none';
            return;
        }

        paginationContainer.style.display = 'flex';

        prevButton.disabled = this.currentPage <= 1;
        nextButton.disabled = this.currentPage >= totalPages;

        pageNumbers.innerHTML = '';
        const maxVisiblePages = 5;
        let startPage = Math.max(1, this.currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);

        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }

        for (let i = startPage; i <= endPage; i++) {
            const pageButton = document.createElement('button');
            pageButton.textContent = i;
            pageButton.className = `pagination-btn ${i === this.currentPage ? 'active' : ''}`;
            pageButton.addEventListener('click', () => {
                this.currentPage = i;
                this.performSearch();
            });
            pageNumbers.appendChild(pageButton);
        }
    }

    updateResultsCount() {
        const resultsCount = document.getElementById('results-count');
        const total = this.filteredBooks.length;
        const startIndex = (this.currentPage - 1) * this.itemsPerPage + 1;
        const endIndex = Math.min(startIndex + this.itemsPerPage - 1, total);

        if (total === 0) {
            resultsCount.textContent = 'No results found';
        } else if (total <= this.itemsPerPage) {
            resultsCount.textContent = `Showing ${total} book${total === 1 ? '' : 's'}`;
        } else {
            resultsCount.textContent = `Showing ${startIndex}-${endIndex} of ${total} books`;
        }
    }

    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Descriptions in the CSV contain editorial HTML (<p>, <em>, etc.);
    // strip tags and collapse whitespace before rendering as body copy.
    stripHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.innerHTML = text;
        return (div.textContent || div.innerText || '').replace(/\s+/g, ' ').trim();
    }

    // accession_no in the CSV is inconsistently formatted: some entries are
    // ISO dates ("2026-04-19"), others use month names ("October 29, 2025"),
    // month-year ("October 2024"), or seasons ("Summer 2023"). Normalize to
    // YYYY-MM-DD so string comparison gives correct chronological order.
    normalizeAccessionDate(v) {
        if (!v || v === 'NULL') return null;
        const s = String(v).trim();
        if (!s) return null;

        const pad = n => String(n).padStart(2, '0');
        const monthIndex = name => {
            const months = ['january','february','march','april','may','june',
                            'july','august','september','october','november','december'];
            const short = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
            const lc = name.toLowerCase();
            let i = months.indexOf(lc);
            if (i < 0) i = short.indexOf(lc);
            return i >= 0 ? i + 1 : null;
        };
        const seasons = { spring: 3, summer: 6, fall: 9, autumn: 9, winter: 12 };

        let m;
        if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) {
            return `${m[1]}-${pad(m[2])}-${pad(m[3])}`;
        }
        if ((m = s.match(/^([A-Za-z]+)\s+(\d{1,2}),?\s+(\d{4})$/))) {
            const mi = monthIndex(m[1]);
            if (mi) return `${m[3]}-${pad(mi)}-${pad(m[2])}`;
        }
        if ((m = s.match(/^([A-Za-z]+)\s+(\d{4})$/))) {
            const mi = monthIndex(m[1]);
            if (mi) return `${m[2]}-${pad(mi)}-01`;
            const si = seasons[m[1].toLowerCase()];
            if (si) return `${m[2]}-${pad(si)}-01`;
        }
        if ((m = s.match(/^(\d{4})$/))) {
            return `${m[1]}-01-01`;
        }
        return null;
    }

    displayError(message) {
        const resultsContainer = document.getElementById('search-results');
        resultsContainer.innerHTML = `
            <div class="error-state">
                <i class="fas fa-exclamation-triangle" style="color: var(--color-brown);"></i>
                <h3 class="state-title">Error</h3>
                <p class="state-text">${message}</p>
            </div>
        `;
    }
}

document.addEventListener('DOMContentLoaded', () => {
    new BookSearch();
});
</script>
