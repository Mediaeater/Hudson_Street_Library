---
title: Search the Collection
layout: layouts/base.njk
currentPage: search
---

<main class="container mx-auto px-6 py-8 mt-20">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold text-center mb-8 text-teal-900">Search the Collection</h1>
        
        <!-- Search Controls -->
        <div class="bg-neutral-50 p-6 rounded-lg mb-8">
            <div class="flex flex-col md:flex-row gap-4 mb-4">
                <div class="flex-1">
                    <label for="search-input" class="block text-sm font-medium text-neutral-700 mb-2">Search books</label>
                    <input type="text" 
                           id="search-input" 
                           placeholder="Search by title, author, publisher, or keywords..."
                           class="w-full px-4 py-2 border border-neutral-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500">
                </div>
                <div class="md:w-48">
                    <label for="sort-select" class="block text-sm font-medium text-neutral-700 mb-2">Sort by</label>
                    <select id="sort-select" class="w-full px-4 py-2 border border-neutral-300 rounded-md focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="title">Title</option>
                        <option value="author">Author</option>
                        <option value="year">Publication Year</option>
                        <option value="publisher">Publisher</option>
                    </select>
                </div>
            </div>
            
            <!-- Filter Controls -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label for="publisher-filter" class="block text-sm font-medium text-neutral-700 mb-2">Publisher</label>
                    <select id="publisher-filter" class="w-full px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="">All Publishers</option>
                    </select>
                </div>
                <div>
                    <label for="year-filter" class="block text-sm font-medium text-neutral-700 mb-2">Publication Year</label>
                    <select id="year-filter" class="w-full px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="">All Years</option>
                    </select>
                </div>
                <div>
                    <label for="collection-filter" class="block text-sm font-medium text-neutral-700 mb-2">Collection</label>
                    <select id="collection-filter" class="w-full px-3 py-2 border border-neutral-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                        <option value="">All Collections</option>
                    </select>
                </div>
            </div>
            
            <div class="mt-4 flex justify-between items-center">
                <button id="clear-filters" class="text-sm text-teal-700 hover:text-teal-900 underline">
                    Clear all filters
                </button>
                <div id="results-count" class="text-sm text-neutral-600">
                    Loading books...
                </div>
            </div>
        </div>
        
        <!-- Search Results -->
        <div id="search-results" class="space-y-4">
            <div class="text-center py-8">
                <i class="fas fa-spinner fa-spin text-2xl text-teal-600 mb-4"></i>
                <p class="text-neutral-600">Loading collection...</p>
            </div>
        </div>
        
        <!-- Pagination -->
        <div id="pagination" class="mt-8 flex justify-center space-x-2 hidden">
            <button id="prev-page" class="px-4 py-2 bg-neutral-200 text-neutral-700 rounded hover:bg-neutral-300 disabled:opacity-50" disabled>
                Previous
            </button>
            <div id="page-numbers" class="flex space-x-1"></div>
            <button id="next-page" class="px-4 py-2 bg-neutral-200 text-neutral-700 rounded hover:bg-neutral-300 disabled:opacity-50" disabled>
                Next
            </button>
        </div>
    </div>
</main>

<script>
class BookSearch {
    constructor() {
        this.books = [];
        this.filteredBooks = [];
        this.currentPage = 1;
        this.itemsPerPage = 20;
        this.searchTerm = '';
        this.filters = {
            publisher: '',
            year: '',
            collection: ''
        };
        this.sortBy = 'title';
        
        this.init();
    }
    
    async init() {
        await this.loadBooks();
        this.setupEventListeners();
        this.populateFilters();
        this.performSearch();
    }
    
    async loadBooks() {
        try {
            const response = await fetch('/data/books.json');
            if (!response.ok) {
                // Fallback to CSV if JSON doesn't exist
                return await this.loadBooksFromCSV();
            }
            this.books = await response.json();
        } catch (error) {
            console.warn('Failed to load books.json, trying CSV:', error);
            await this.loadBooksFromCSV();
        }
    }
    
    async loadBooksFromCSV() {
        try {
            const response = await fetch('/cms/data/books.csv');
            const csvText = await response.text();
            this.books = this.parseCSV(csvText);
        } catch (error) {
            console.error('Failed to load books data:', error);
            this.displayError('Failed to load book collection. Please try again later.');
        }
    }
    
    parseCSV(csvText) {
        const lines = csvText.split('\n');
        const headers = lines[0].split(',').map(h => h.replace(/"/g, '').trim());
        const books = [];
        
        for (let i = 1; i < lines.length; i++) {
            const line = lines[i].trim();
            if (!line) continue;
            
            const values = this.parseCSVLine(line);
            if (values.length >= headers.length) {
                const book = {};
                headers.forEach((header, index) => {
                    book[header] = values[index] ? values[index].replace(/"/g, '').trim() : '';
                });
                books.push(book);
            }
        }
        
        return books;
    }
    
    parseCSVLine(line) {
        const result = [];
        let current = '';
        let inQuotes = false;
        
        for (let i = 0; i < line.length; i++) {
            const char = line[i];
            
            if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
                result.push(current);
                current = '';
            } else {
                current += char;
            }
        }
        
        result.push(current);
        return result;
    }
    
    setupEventListeners() {
        const searchInput = document.getElementById('search-input');
        const sortSelect = document.getElementById('sort-select');
        const publisherFilter = document.getElementById('publisher-filter');
        const yearFilter = document.getElementById('year-filter');
        const collectionFilter = document.getElementById('collection-filter');
        const clearFilters = document.getElementById('clear-filters');
        const prevPage = document.getElementById('prev-page');
        const nextPage = document.getElementById('next-page');
        
        searchInput.addEventListener('input', (e) => {
            this.searchTerm = e.target.value.toLowerCase();
            this.currentPage = 1;
            this.performSearch();
        });
        
        sortSelect.addEventListener('change', (e) => {
            this.sortBy = e.target.value;
            this.performSearch();
        });
        
        publisherFilter.addEventListener('change', (e) => {
            this.filters.publisher = e.target.value;
            this.currentPage = 1;
            this.performSearch();
        });
        
        yearFilter.addEventListener('change', (e) => {
            this.filters.year = e.target.value;
            this.currentPage = 1;
            this.performSearch();
        });
        
        collectionFilter.addEventListener('change', (e) => {
            this.filters.collection = e.target.value;
            this.currentPage = 1;
            this.performSearch();
        });
        
        clearFilters.addEventListener('click', () => {
            this.clearAllFilters();
        });
        
        prevPage.addEventListener('click', () => {
            if (this.currentPage > 1) {
                this.currentPage--;
                this.performSearch();
            }
        });
        
        nextPage.addEventListener('click', () => {
            const totalPages = Math.ceil(this.filteredBooks.length / this.itemsPerPage);
            if (this.currentPage < totalPages) {
                this.currentPage++;
                this.performSearch();
            }
        });
    }
    
    populateFilters() {
        const publishers = [...new Set(this.books.map(book => book.publisher).filter(p => p))].sort();
        const years = [...new Set(this.books.map(book => book.publication_year).filter(y => y))].sort((a, b) => b - a);
        const collections = [...new Set(this.books.map(book => book.collection_grouping).filter(c => c))].sort();
        
        this.populateSelect('publisher-filter', publishers);
        this.populateSelect('year-filter', years);
        this.populateSelect('collection-filter', collections);
    }
    
    populateSelect(selectId, options) {
        const select = document.getElementById(selectId);
        const currentValue = select.value;
        
        // Clear existing options except the first one
        while (select.children.length > 1) {
            select.removeChild(select.lastChild);
        }
        
        options.forEach(option => {
            const optionElement = document.createElement('option');
            optionElement.value = option;
            optionElement.textContent = option;
            select.appendChild(optionElement);
        });
        
        select.value = currentValue;
    }
    
    clearAllFilters() {
        document.getElementById('search-input').value = '';
        document.getElementById('sort-select').value = 'title';
        document.getElementById('publisher-filter').value = '';
        document.getElementById('year-filter').value = '';
        document.getElementById('collection-filter').value = '';
        
        this.searchTerm = '';
        this.filters = { publisher: '', year: '', collection: '' };
        this.sortBy = 'title';
        this.currentPage = 1;
        this.performSearch();
    }
    
    performSearch() {
        this.filteredBooks = this.books.filter(book => {
            // Search term filter
            if (this.searchTerm) {
                const searchableText = [
                    book.title,
                    book.author_full_name,
                    book.publisher,
                    book.description,
                    book.tags
                ].join(' ').toLowerCase();
                
                if (!searchableText.includes(this.searchTerm)) {
                    return false;
                }
            }
            
            // Publisher filter
            if (this.filters.publisher && book.publisher !== this.filters.publisher) {
                return false;
            }
            
            // Year filter
            if (this.filters.year && book.publication_year !== this.filters.year) {
                return false;
            }
            
            // Collection filter
            if (this.filters.collection && book.collection_grouping !== this.filters.collection) {
                return false;
            }
            
            return true;
        });
        
        this.sortResults();
        this.displayResults();
        this.updatePagination();
        this.updateResultsCount();
    }
    
    sortResults() {
        this.filteredBooks.sort((a, b) => {
            let aValue, bValue;
            
            switch (this.sortBy) {
                case 'author':
                    aValue = a.author_full_name || '';
                    bValue = b.author_full_name || '';
                    break;
                case 'year':
                    aValue = parseInt(a.publication_year) || 0;
                    bValue = parseInt(b.publication_year) || 0;
                    return bValue - aValue; // Descending order for years
                case 'publisher':
                    aValue = a.publisher || '';
                    bValue = b.publisher || '';
                    break;
                default:
                    aValue = a.title || '';
                    bValue = b.title || '';
            }
            
            return aValue.toString().localeCompare(bValue.toString());
        });
    }
    
    displayResults() {
        const resultsContainer = document.getElementById('search-results');
        const startIndex = (this.currentPage - 1) * this.itemsPerPage;
        const endIndex = startIndex + this.itemsPerPage;
        const pageBooks = this.filteredBooks.slice(startIndex, endIndex);
        
        if (pageBooks.length === 0) {
            resultsContainer.innerHTML = `
                <div class="text-center py-8">
                    <i class="fas fa-search text-4xl text-neutral-300 mb-4"></i>
                    <h3 class="text-xl font-semibold text-neutral-600 mb-2">No books found</h3>
                    <p class="text-neutral-500">Try adjusting your search terms or filters.</p>
                </div>
            `;
            return;
        }
        
        resultsContainer.innerHTML = pageBooks.map(book => this.renderBookCard(book)).join('');
    }
    
    renderBookCard(book) {
        const imageUrl = book.image_url || '/assets/images/placeholder-book.jpg';
        const price = book.price_usd ? `$${parseFloat(book.price_usd).toFixed(2)}` : '';
        const year = book.publication_year || '';
        const pages = book.page_count ? `${book.page_count} pages` : '';
        const binding = book.binding || '';
        
        return `
            <div class="bg-white border border-neutral-200 rounded-lg p-6 hover:shadow-md transition-shadow">
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="md:w-32 md:flex-shrink-0">
                        <img src="${imageUrl}" 
                             alt="${this.escapeHtml(book.title)}"
                             class="w-full h-40 md:h-48 object-cover rounded border"
                             onerror="this.src='/assets/images/placeholder-book.jpg'">
                    </div>
                    <div class="flex-1">
                        <h3 class="text-xl font-semibold text-teal-900 mb-2">
                            ${this.escapeHtml(book.title)}
                        </h3>
                        <p class="text-neutral-700 mb-2">
                            by ${this.escapeHtml(book.author_full_name || 'Unknown Author')}
                        </p>
                        <div class="text-sm text-neutral-600 mb-3">
                            <div class="flex flex-wrap gap-4">
                                ${book.publisher ? `<span><strong>Publisher:</strong> ${this.escapeHtml(book.publisher)}</span>` : ''}
                                ${year ? `<span><strong>Year:</strong> ${year}</span>` : ''}
                                ${binding ? `<span><strong>Format:</strong> ${this.escapeHtml(binding)}</span>` : ''}
                                ${pages ? `<span><strong>Pages:</strong> ${pages}</span>` : ''}
                            </div>
                        </div>
                        ${book.description ? `
                            <p class="text-neutral-700 text-sm leading-relaxed mb-3 line-clamp-3">
                                ${this.escapeHtml(book.description.substring(0, 200))}${book.description.length > 200 ? '...' : ''}
                            </p>
                        ` : ''}
                        <div class="flex justify-between items-center">
                            ${book.collection_grouping ? `
                                <span class="inline-block bg-teal-100 text-teal-800 text-xs px-2 py-1 rounded">
                                    ${this.escapeHtml(book.collection_grouping)}
                                </span>
                            ` : '<span></span>'}
                            ${price ? `<span class="text-lg font-semibold text-teal-700">${price}</span>` : ''}
                        </div>
                    </div>
                </div>
            </div>
        `;
    }
    
    updatePagination() {
        const totalPages = Math.ceil(this.filteredBooks.length / this.itemsPerPage);
        const paginationContainer = document.getElementById('pagination');
        const prevButton = document.getElementById('prev-page');
        const nextButton = document.getElementById('next-page');
        const pageNumbers = document.getElementById('page-numbers');
        
        if (totalPages <= 1) {
            paginationContainer.classList.add('hidden');
            return;
        }
        
        paginationContainer.classList.remove('hidden');
        
        prevButton.disabled = this.currentPage <= 1;
        nextButton.disabled = this.currentPage >= totalPages;
        
        // Generate page numbers
        pageNumbers.innerHTML = '';
        const maxVisiblePages = 5;
        let startPage = Math.max(1, this.currentPage - Math.floor(maxVisiblePages / 2));
        let endPage = Math.min(totalPages, startPage + maxVisiblePages - 1);
        
        if (endPage - startPage + 1 < maxVisiblePages) {
            startPage = Math.max(1, endPage - maxVisiblePages + 1);
        }
        
        for (let i = startPage; i <= endPage; i++) {
            const pageButton = document.createElement('button');
            pageButton.textContent = i;
            pageButton.className = `px-3 py-2 rounded ${
                i === this.currentPage 
                    ? 'bg-teal-600 text-white' 
                    : 'bg-neutral-200 text-neutral-700 hover:bg-neutral-300'
            }`;
            pageButton.addEventListener('click', () => {
                this.currentPage = i;
                this.performSearch();
            });
            pageNumbers.appendChild(pageButton);
        }
    }
    
    updateResultsCount() {
        const resultsCount = document.getElementById('results-count');
        const total = this.filteredBooks.length;
        const startIndex = (this.currentPage - 1) * this.itemsPerPage + 1;
        const endIndex = Math.min(startIndex + this.itemsPerPage - 1, total);
        
        if (total === 0) {
            resultsCount.textContent = 'No results found';
        } else if (total <= this.itemsPerPage) {
            resultsCount.textContent = `Showing ${total} book${total === 1 ? '' : 's'}`;
        } else {
            resultsCount.textContent = `Showing ${startIndex}-${endIndex} of ${total} books`;
        }
    }
    
    escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    displayError(message) {
        const resultsContainer = document.getElementById('search-results');
        resultsContainer.innerHTML = `
            <div class="text-center py-8">
                <i class="fas fa-exclamation-triangle text-4xl text-red-400 mb-4"></i>
                <h3 class="text-xl font-semibold text-red-600 mb-2">Error</h3>
                <p class="text-neutral-600">${message}</p>
            </div>
        `;
    }
}

// Initialize the search when the page loads
document.addEventListener('DOMContentLoaded', () => {
    new BookSearch();
});
</script>
