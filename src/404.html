<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Hudson Street Library</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="stylesheet" href="/assets/css/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Montserrat, sans-serif;
            background-color: #134e4a;
            color: #f5f5f4;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Grid system - library shelf dividers */
        .grid-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            z-index: 1;
        }

        .grid-line {
            border-right: 2px solid rgba(245, 245, 244, 0.15);
            position: relative;
        }

        /* Header navigation */
        .nav-header {
            position: relative;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .nav-header a {
            color: #f5f5f4;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .nav-header a:hover {
            opacity: 0.7;
        }

        .logo {
            font-size: 0.875rem;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        /* Main content */
        .content {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 2rem;
        }

        /* Lost text */
        .lost-text {
            font-size: 3rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 2rem;
            color: #f5f5f4;
        }

        /* Call number styling */
        .call-number-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem 0;
        }

        .dewey-label {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;
            font-size: 1rem;
            font-weight: 700;
            color: #f5f5f4;
            margin-bottom: 1rem;
            letter-spacing: 0.1em;
        }

        .call-number {
            display: flex;
            gap: 2rem;
            align-items: center;
            margin-bottom: 2rem;
        }

        .number {
            font-size: clamp(8rem, 20vw, 16rem);
            font-weight: 900;
            line-height: 0.9;
            color: #f5f5f4;
        }

        .classification-text {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, Courier New, monospace;
            font-size: 1.125rem;
            color: #f5f5f4;
            margin-bottom: 3rem;
            max-width: 500px;
            text-align: center;
            line-height: 1.6;
        }

        /* Back to home link */
        .back-link {
            align-self: flex-end;
            font-size: 2.5rem;
            font-weight: 900;
            line-height: 1;
            color: #f5f5f4;
            text-decoration: none;
            text-align: right;
            transition: opacity 0.2s;
            margin-top: auto;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }

            .lost-text {
                font-size: 2rem;
            }

            .number {
                font-size: clamp(4rem, 15vw, 8rem);
            }

            .call-number {
                gap: 1rem;
            }

            .back-link {
                font-size: 1.75rem;
            }

            .classification-text {
                font-size: 1rem;
                padding: 0 1rem;
            }
        }

        @media (max-width: 480px) {
            .content {
                padding: 1rem;
            }

            .nav-header {
                padding: 1rem;
            }

            .call-number {
                flex-direction: column;
                gap: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <!-- Grid background -->
    <div class="grid-container">
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
        <div class="grid-line"></div>
    </div>

    <!-- Content -->
    <div class="content">
        <!-- Header navigation -->
        <nav class="nav-header">
            <a href="/" class="logo">Hudson Street Library</a>
            <div class="nav-links">
                <a href="/collection-explore.html">Collections</a>
                <a href="/static-demo/">Search</a>
                <a href="/collections/recently_added.html">News</a>
            </div>
        </nav>

        <!-- Lost text -->
        <div class="lost-text">
            NOT IN<br>
            CATALOG?
        </div>

        <!-- Call number section -->
        <div class="call-number-section">
            <div class="dewey-label">DEWEY DECIMAL CLASSIFICATION</div>

            <div class="call-number">
                <span class="number">4</span>
                <span class="number">0</span>
                <span class="number">4</span>
            </div>

            <div class="classification-text">
                404.000 — ERROR: PAGE NOT FOUND<br>
                <br>
                This page has been misshelved, checked out permanently,<br>
                or removed from the collection.
            </div>
        </div>

        <!-- Back to home -->
        <a href="/" class="back-link">
            BACK TO<br>
            HOME
        </a>
    </div>
</body>
</html>
