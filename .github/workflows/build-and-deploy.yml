name: Build and Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: write  # Need write to push to gh-pages branch
  pages: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Install dependencies
        run: npm ci

      # CSV structure, source-level design rules and the mocha suite. Runs
      # before the build so a failing test stops the deploy.
      - name: Run tests
        run: npm test

      - name: Clear Eleventy cache
        run: rm -rf _site .cache

      # The build ships web-sized copies of oversized images
      # (scripts/utils/web-images.js). Encoding all of them takes about a
      # minute; with this cache only new or changed images are encoded.
      - name: Restore resized-image cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .image-cache
          key: web-images-${{ hashFiles('scripts/utils/web-images.js', 'src/assets/images/**') }}
          restore-keys: web-images-

      - name: Build with Eleventy
        run: npm run build

      - name: Copy manual book pages (custom content overrides)
        run: |
          if [ -d "src/books/manual" ]; then
            cp -r src/books/manual/* _site/books/
            echo "Copied manual book pages to _site/books/"
          fi

      # Runs against the final _site, after the manual pages are copied in, so
      # it validates exactly what ships. Catches the drift that rendered-state
      # spot checks miss: off-palette greens in :hover / :focus / @media rules,
      # pages that never load tailwind.css (where @layer base is inert), and
      # any page that starts hand-rolling the header again.
      - name: Validate design system
        run: node scripts/validate-design-system.js

      # Structured data fails silently — a malformed ld+json block is discarded
      # by search engines while the page renders fine, so nothing short of
      # parsing every block catches it. Runs against the final _site for the
      # same reason as the design check above.
      - name: Validate JSON-LD
        run: node scripts/validate-jsonld.js

      - name: Audit dependencies
        run: npm audit --audit-level=critical

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          # One commit on gh-pages, replaced on every deploy. The branch had grown
          # to 600+ commits of a full site. main holds the history that matters.
          force_orphan: true

