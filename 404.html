<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found · Hudson Street Library</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
    <link rel="stylesheet" href="/assets/css/tailwind.css">
    <link rel="stylesheet" href="/assets/css/design-system.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=Crimson+Pro:wght@300;400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-ink: #0A0A0A;
            --color-paper: #F8F7F4;
            --color-vellum: #EEEDE8;
            --color-brown: #8B7355;
            --color-border: rgba(10, 10, 10, 0.12);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--color-paper);
            color: var(--color-ink);
            font-family: 'Literata', Georgia, serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .error-header {
            padding: 2rem;
            border-bottom: 1px solid var(--color-border);
        }

        .header-link {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-brown);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .header-link:hover {
            color: var(--color-ink);
        }

        /* Main Content */
        .error-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            text-align: center;
        }

        .classification-label {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--color-brown);
            margin-bottom: 2rem;
        }

        .error-number {
            font-family: 'Literata', Georgia, serif;
            font-size: clamp(6rem, 15vw, 12rem);
            font-weight: 700;
            line-height: 0.9;
            letter-spacing: -0.02em;
            color: var(--color-ink);
            margin-bottom: 2rem;
        }

        .error-title {
            font-family: 'Literata', Georgia, serif;
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.1;
            color: var(--color-brown);
            margin-bottom: 1.5rem;
        }

        .error-description {
            font-size: clamp(1rem, 2vw, 1.125rem);
            line-height: 1.7;
            max-width: 60ch;
            margin: 0 auto 3rem;
            font-weight: 300;
            color: var(--color-ink);
        }

        .error-actions {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }

        .error-link {
            font-family: 'Archivo Narrow', sans-serif;
            font-size: 0.875rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 1rem 2rem;
            border: 2px solid var(--color-ink);
            color: var(--color-ink);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
        }

        .error-link:hover {
            background: var(--color-ink);
            color: var(--color-paper);
            transform: translateY(-2px);
        }

        .error-link.secondary {
            border-color: var(--color-brown);
            color: var(--color-brown);
        }

        .error-link.secondary:hover {
            background: var(--color-brown);
            color: var(--color-paper);
        }

        /* Decorative Elements */
        .decorative-line {
            width: 200px;
            height: 1px;
            background: var(--color-border);
            margin: 3rem auto;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .error-header {
                padding: 1.5rem;
            }

            .error-content {
                padding: 3rem 1.5rem;
            }

            .error-actions {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }

            .error-link {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header class="error-header">
        <a href="/" class="header-link">← Hudson Street Library</a>
    </header>

    <!-- Main Content -->
    <main class="error-content">
        <div class="classification-label">Error Code</div>

        <h1 class="error-number">404</h1>

        <h2 class="error-title">Page Not Found</h2>

        <p class="error-description">
            The page you're looking for has been misshelved, checked out permanently,
            or removed from our collection. Perhaps it was never cataloged at all.
        </p>

        <div class="decorative-line"></div>

        <div class="error-actions">
            <a href="/" class="error-link">Return Home</a>
            <a href="/collection-explore.html" class="error-link secondary">Browse Collections</a>
            <a href="/static-demo/" class="error-link secondary">Search Library</a>
        </div>
    </main>

</body>
</html>
