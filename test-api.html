<!DOCTYPE html>
<html>
<head>
    <title>Test CMS API</title>
</head>
<body>
    <h1>Testing CMS API Connection</h1>
    <div id="results"></div>
    
    <script src="config.js"></script>
    <script src="js/api.js"></script>
    <script>
        async function testAPI() {
            const results = document.getElementById('results');
            
            // Test fetching books
            results.innerHTML = '<p>Testing API connection...</p>';
            
            try {
                // Test authentication
                await authenticate();
                results.innerHTML += '<p>✅ Authentication successful</p>';
                
                // Test fetching books
                const books = await fetchBooks({ limit: 5 });
                results.innerHTML += `<p>✅ Found ${books.length} books</p>`;
                
                if (books.length > 0) {
                    results.innerHTML += '<h2>First 5 Books:</h2><ul>';
                    books.forEach(book => {
                        results.innerHTML += `<li>${book.title} by ${book.author_first_name} ${book.author_last_name}</li>`;
                    });
                    results.innerHTML += '</ul>';
                }
                
                // Test fetching collections
                const collections = await fetchCollections();
                results.innerHTML += `<p>✅ Found ${collections.length} collections</p>`;
                
            } catch (error) {
                results.innerHTML += `<p>❌ Error: ${error.message}</p>`;
            }
        }
        
        // Run test when page loads
        testAPI();
    </script>
</body>
</html>
